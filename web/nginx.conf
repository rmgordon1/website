# Inside the web container. The EC2 nginx (TLS) -> reverse SSH tunnel ->
# this Jetson's localhost:3000 -> this server on port 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind two proxies: keep redirects relative so they stay on https://thebertgordon.com.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The game's API (api container).
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 4k;
    }

    # The portfolio. A missing page is a 404, never the game.
    location = /portfolio {
        return 301 /portfolio/;
    }
    location /portfolio/ {
        try_files $uri $uri/ $uri.html =404;
    }
    location /portfolio/_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The game. Vite's hashed bundles never change, so cache them for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # Not in nginx's mime.types; browsers want this for the install manifest.
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    # Pages themselves are always checked, so a deploy shows up at once.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
